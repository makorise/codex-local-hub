<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">Codex 瞭望台工作原理</title>
  <desc id="desc">四阶段流程图：安装到 Mac、读取本地 Codex 状态、通过本地 Node.js 中继同步，以及从手机双向操作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0e18"/><stop offset="1" stop-color="#11182a"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171f31"/><stop offset="1" stop-color="#101625"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72a7ff"/><stop offset="1" stop-color="#a083ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5fe2ac"/><stop offset="1" stop-color="#55bfff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#779ff6"/></marker>
  </defs>
  <rect width="1400" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="138" cy="-20" r="235" fill="#4e78ff" opacity=".09"/>
  <circle cx="1308" cy="605" r="290" fill="#8a5dff" opacity=".08"/>

  <text x="48" y="66" fill="#f5f7fc" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="720">把 Mac 上的 Codex 工作台，安全带到手机上</text>
  <text x="48" y="99" fill="#8f9bb1" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">本地优先 · 不经过第三方聊天镜像 · 不同步隐藏推理</text>

  <g filter="url(#shadow)">
    <rect x="48" y="142" width="278" height="326" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="363" y="142" width="278" height="326" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="678" y="142" width="278" height="326" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="993" y="142" width="359" height="326" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(72 166)">
      <rect width="36" height="36" rx="11" fill="#78a8ff" fill-opacity=".13" stroke="#78a8ff" stroke-opacity=".28"/>
      <text x="18" y="24" text-anchor="middle" fill="#9dc0ff" font-size="15" font-weight="760">1</text>
      <rect x="70" y="16" width="112" height="73" rx="9" fill="none" stroke="#dfe8f8" stroke-width="3"/>
      <path d="M55 101h142M92 89l-7 12m82-12 7 12" fill="none" stroke="#70809a" stroke-width="3" stroke-linecap="round"/>
      <rect x="105" y="37" width="42" height="31" rx="8" fill="url(#accent)" opacity=".9"/>
      <path d="M117 51h18m-9-9v18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
      <text x="0" y="144" fill="#f2f5fb" font-size="19" font-weight="700">安装到 Mac</text>
      <text x="0" y="178" fill="#9aa6ba" font-size="14.5">打开原生宿主程序，自动</text>
      <text x="0" y="202" fill="#9aa6ba" font-size="14.5">启动内置的 Node.js 服务，</text>
      <text x="0" y="226" fill="#9aa6ba" font-size="14.5">监听本机 8787 端口。</text>
      <rect x="0" y="252" width="124" height="28" rx="14" fill="#5fe2ac" fill-opacity=".09" stroke="#5fe2ac" stroke-opacity=".18"/>
      <circle cx="16" cy="266" r="4" fill="#5fe2ac"/>
      <text x="28" y="271" fill="#8ee9c3" font-size="12" font-weight="650">仅在本机运行</text>
    </g>

    <g transform="translate(387 166)">
      <rect width="36" height="36" rx="11" fill="#9d83ff" fill-opacity=".13" stroke="#a083ff" stroke-opacity=".28"/>
      <text x="18" y="24" text-anchor="middle" fill="#c3b4ff" font-size="15" font-weight="760">2</text>
      <ellipse cx="126" cy="36" rx="55" ry="18" fill="#8f73ff" fill-opacity=".16" stroke="#aa96ff" stroke-opacity=".72" stroke-width="2"/>
      <path d="M71 36v55c0 10 25 18 55 18s55-8 55-18V36M71 64c0 10 25 18 55 18s55-8 55-18" fill="none" stroke="#a895ff" stroke-opacity=".75" stroke-width="2"/>
      <circle cx="197" cy="83" r="25" fill="#111827" stroke="#78a8ff" stroke-opacity=".65" stroke-width="2"/>
      <path d="M187 83h20m-10-10v20" stroke="#8db7ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="144" fill="#f2f5fb" font-size="19" font-weight="700">读取 Codex 本地状态</text>
      <text x="0" y="178" fill="#9aa6ba" font-size="14.5">任务状态和最近可见消息</text>
      <text x="0" y="202" fill="#9aa6ba" font-size="14.5">来自 Codex 本地数据库与</text>
      <text x="0" y="226" fill="#9aa6ba" font-size="14.5">官方控制接口。</text>
      <rect x="0" y="252" width="190" height="28" rx="14" fill="#a083ff" fill-opacity=".09" stroke="#a083ff" stroke-opacity=".18"/>
      <text x="14" y="271" fill="#bfaeff" font-size="12" font-weight="650">~/.codex 数据库与命令行</text>
    </g>

    <g transform="translate(702 166)">
      <rect width="36" height="36" rx="11" fill="#5fe2ac" fill-opacity=".11" stroke="#5fe2ac" stroke-opacity=".25"/>
      <text x="18" y="24" text-anchor="middle" fill="#91ebc7" font-size="15" font-weight="760">3</text>
      <circle cx="126" cy="65" r="52" fill="#5fe2ac" fill-opacity=".07" stroke="#5fe2ac" stroke-opacity=".48" stroke-width="2"/>
      <circle cx="126" cy="65" r="31" fill="#78a8ff" fill-opacity=".1" stroke="#78a8ff" stroke-opacity=".48" stroke-width="2"/>
      <circle cx="126" cy="65" r="7" fill="url(#green)"/>
      <path d="M126 13v14m0 76v14M74 65H60m132 0h-14M89 28l10 10m54 54 10 10m0-74-10 10M99 92l-10 10" stroke="#7990b0" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="144" fill="#f2f5fb" font-size="19" font-weight="700">通过局域网同步</text>
      <text x="0" y="178" fill="#9aa6ba" font-size="14.5">局域网接口和实时事件</text>
      <text x="0" y="202" fill="#9aa6ba" font-size="14.5">会在状态变化时刷新手机</text>
      <text x="0" y="226" fill="#9aa6ba" font-size="14.5">工作台。</text>
      <rect x="0" y="252" width="156" height="28" rx="14" fill="#5fe2ac" fill-opacity=".09" stroke="#5fe2ac" stroke-opacity=".18"/>
      <text x="14" y="271" fill="#8ee9c3" font-size="12" font-weight="650">可信局域网网址</text>
    </g>

    <g transform="translate(1017 166)">
      <rect width="36" height="36" rx="11" fill="#78a8ff" fill-opacity=".13" stroke="#78a8ff" stroke-opacity=".28"/>
      <text x="18" y="24" text-anchor="middle" fill="#9dc0ff" font-size="15" font-weight="760">4</text>
      <rect x="110" y="0" width="114" height="126" rx="22" fill="#090d16" stroke="#dce6f7" stroke-opacity=".72" stroke-width="3"/>
      <rect x="121" y="17" width="92" height="92" rx="12" fill="#141c2b"/>
      <rect x="130" y="28" width="74" height="16" rx="7" fill="#78a8ff" fill-opacity=".2"/>
      <rect x="130" y="51" width="74" height="22" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="130" y="80" width="53" height="17" rx="7" fill="#8f73ff" fill-opacity=".2"/>
      <circle cx="167" cy="117" r="3" fill="#75839b"/>
      <text x="0" y="158" fill="#f2f5fb" font-size="19" font-weight="700">在手机上监控和控制</text>
      <text x="0" y="192" fill="#9aa6ba" font-size="14.5">查看进度、目标、用量、</text>
      <text x="0" y="216" fill="#9aa6ba" font-size="14.5">最近消息和图片；发送、</text>
      <text x="0" y="240" fill="#9aa6ba" font-size="14.5">排队、插队或恢复任务。</text>
      <rect x="0" y="266" width="183" height="28" rx="14" fill="#78a8ff" fill-opacity=".09" stroke="#78a8ff" stroke-opacity=".18"/>
      <text x="14" y="285" fill="#a9c7ff" font-size="12" font-weight="650">浏览器或桌面快捷方式</text>
    </g>
  </g>

  <path d="M327 305h28" stroke="#779ff6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M642 305h28" stroke="#779ff6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M957 305h28" stroke="#779ff6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="48" y="505" width="1304" height="87" rx="20" fill="#0d1421" stroke="#ffffff" stroke-opacity=".07"/>
  <path d="M620 538h382" stroke="#5fe2ac" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1002 565H620" stroke="#9b83ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="650">
    <text x="72" y="542" fill="#88e8c0">Mac → 手机</text><text x="181" y="542" fill="#97a3b8">实时推送任务变化</text>
    <text x="72" y="569" fill="#beaefe">手机 → Mac</text><text x="181" y="569" fill="#97a3b8">通过 Codex 控制接口发送提示词和队列操作</text>
    <text x="1030" y="556" fill="#707c91">可信局域网</text>
  </g>
</svg>
