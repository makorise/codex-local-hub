name: Feature request
description: Suggest an improvement to Codex Lookout
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes: { label: Problem, description: What workflow is difficult today? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Proposed experience, description: Describe the smallest useful solution. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Privacy and network impact, description: Does this send or store any new data? }
