name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and tests
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
          npm run test:coverage
          zsh scripts/test-macos-update.sh
      - name: Configure Developer ID signing when available
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          keychain="$RUNNER_TEMP/codex-local-hub.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p codex-local-hub-ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p codex-local-hub-ci "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k codex-local-hub-ci "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "DEVELOPER_ID_APPLICATION=$identity" >> "$GITHUB_ENV"
      - name: Build installer
        run: |
          npm run package:core
          npm run package:mac
      - name: Verify installer and checksum
        run: |
          dmg="dist/Codex-Local-Hub-$(node -p "require('./package.json').version")-universal.dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          codesign --verify --deep --strict --verbose=2 "dist/Codex Local Hub.app"
      - name: Publish stable notarized release
        if: ${{ env.DEVELOPER_ID_APPLICATION != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" "dist/Codex-Local-Hub-core-$version.zip" "dist/Codex-Local-Hub-core-$version.zip.sha256" "dist/Codex-Local-Hub-$version-universal.dmg" "dist/Codex-Local-Hub-$version-universal.dmg.sha256" --verify-tag --generate-notes --title "Codex Local Hub $version"
      - name: Publish unsigned prerelease
        if: ${{ !(env.DEVELOPER_ID_APPLICATION != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" "dist/Codex-Local-Hub-core-$version.zip" "dist/Codex-Local-Hub-core-$version.zip.sha256" "dist/Codex-Local-Hub-$version-universal.dmg" "dist/Codex-Local-Hub-$version-universal.dmg.sha256" --verify-tag --generate-notes --prerelease --title "Codex Local Hub $version (unsigned preview)"
