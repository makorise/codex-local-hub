name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: BUNDLE_NODE=1 npm run build:mac
      - run: test -x "dist/Codex Local Hub.app/Contents/Resources/runtime/node-arm64"
      - run: test -x "dist/Codex Local Hub.app/Contents/Resources/runtime/node-x64"
      - run: lipo -info "dist/Codex Local Hub.app/Contents/MacOS/CodexLocalHub"
      - run: codesign --verify --deep --strict --verbose=2 "dist/Codex Local Hub.app"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-local-hub-macos
          path: dist/Codex Local Hub.app
